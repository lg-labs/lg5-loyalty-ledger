name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: write

env:
  MAVEN_DIR: ./

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Check if pom.xml exists
        run: |
          if [ ! -f "${{ env.MAVEN_DIR }}/pom.xml" ]; then
            echo "Error: pom.xml not found in the specified directory: ${{ env.MAVEN_DIR }}"
            exit 1
          fi

      - name: Extract Maven coordinates from pom.xml
        id: extract_maven_coordinates
        run: |
          if ! command -v xmllint &> /dev/null; then
            echo "xmllint could not be found, exiting..."
            exit 1
          fi
          
          GROUP_ID=$(xmllint --xpath 'string(//*[local-name()="project"]/*[local-name()="groupId"])' pom.xml)
          ARTIFACT_ID=$(xmllint --xpath 'string(//*[local-name()="project"]/*[local-name()="artifactId"])' pom.xml)
          VERSION=$(xmllint --xpath 'string(//*[local-name()="project"]/*[local-name()="version"])' pom.xml)
          IMAGE_NAME="${GROUP_ID}/${ARTIFACT_ID}:${VERSION}"
          
          if [[ -z "$GROUP_ID" || -z "$ARTIFACT_ID" || -z "$VERSION" ]]; then
            echo "Error: One or more Maven coordinates (GROUP_ID, ARTIFACT_ID, VERSION) could not be extracted."
            exit 1
          fi

          {
            echo "GROUP_ID=$GROUP_ID"
            echo "ARTIFACT_ID=$ARTIFACT_ID"
            echo "VERSION=$VERSION"
            echo "IMAGE_NAME=$IMAGE_NAME"
          } > maven_details.env
          
          echo "Extracted GROUP_ID: $GROUP_ID"
          echo "Extracted ARTIFACT_ID: $ARTIFACT_ID"
          echo "Extracted VERSION: $VERSION"
          echo "Extracted IMAGE_NAME: $IMAGE_NAME"

      - name: Upload Maven details artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-details
          path: maven_details.env

      - name: Setup Maven credentials
        uses: ./.github/actions/setup-maven-credentials
        with:
          github-token: ${{ secrets.PKG_GITHUB_TOKEN }}
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Setup Maven credentials
        uses: ./.github/actions/setup-maven-credentials
        with:
          github-token: ${{ secrets.PKG_GITHUB_TOKEN }}
      - name: Run Checkstyle
        run: make run-checkstyle
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Setup Maven credentials
        uses: ./.github/actions/setup-maven-credentials
        with:
          github-token: ${{ secrets.PKG_GITHUB_TOKEN }}
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Run verify using Makefile
        run: make run-verify
      - name: List files in target directory
        run: ls -al ./lg5-loyalty-ledger-support/target/site
      - name: Upload Test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./lg5-loyalty-ledger-support/target/site/jacoco-aggregate-all
  quality:
    name: Quality
    runs-on: ubuntu-latest
    needs: [ checkstyle, coverage ]
    steps:
      - uses: actions/checkout@v5
      - name: Download Test reports
        uses: actions/download-artifact@v5
        with:
          name: test-reports
          path: ./site
      - name: Confirmation
        run: ls -R
      - name: Download Codacy Coverage Reporter
        run: |
          COV_REPORTER_VERSION=$(curl -s https://api.github.com/repos/codacy/codacy-coverage-reporter/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget -O codacy-coverage-reporter "https://github.com/codacy/codacy-coverage-reporter/releases/download/${COV_REPORTER_VERSION}/codacy-coverage-reporter-linux"
          chmod +x codacy-coverage-reporter
      - name: Confirmation
        run: echo "Sent report to Sonar or Codacy... "
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ checkstyle, coverage ]
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Setup Maven credentials
        uses: ./.github/actions/setup-maven-credentials
        with:
          github-token: ${{ secrets.PKG_GITHUB_TOKEN }}
      - name: Download Maven details artifact
        uses: actions/download-artifact@v5
        with:
          name: maven-details
          path: .

      - name: Load Maven details
        run: |
          set -a
          source maven_details.env
          set +a
          echo "Loaded GROUP_ID: $GROUP_ID, ARTIFACT_ID: $ARTIFACT_ID, VERSION: $VERSION, IMAGE_NAME: $IMAGE_NAME"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"  # <-- Export IMAGE_NAME to the GitHub environment
          echo "GROUP_ID=$GROUP_ID" >> "$GITHUB_ENV"  # <-- Export GROUP_ID to the GitHub environment


      - name: Build using Makefile
        run: make install-skip-test

      - name: Show docker image
        run: |
          echo "${{ env.GROUP_ID }}"
          docker image list | grep ${{ env.GROUP_ID }}

      - name: Save Docker image
        run: |
          docker save -o lg5-loyalty-ledger-service-image.tar ${{ env.IMAGE_NAME }}

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: lg5-loyalty-ledger-service-image.tar
      - name: Upload dependency-graph.png as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: ./target/dependency-graph.png
      # ADR-002 (003-ci-cd-canonical): firebase.json is not yet generated
      # in this repo (Firebase Hosting is deferred to feature 004).
      # Step kept verbatim per spec, but soft-failed so the build job
      # stays green until feature 004 lands a real firebase.json.
      - name: Upload firebase.json as artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: firebase-json
          path: ./firebase.json
          if-no-files-found: warn

  test:
    name: Acceptance Test
    runs-on: ubuntu-latest
    needs: build
    env:
      APPLICATION_TRACES_FILE_ENABLED: "false"
      APPLICATION_LOG_ENABLED: "false"
      APPLICATION_LOG_SOURCE_PATH: "/logs"
      APPLICATION_LOG_DESTINATION_PATH: "./target/logs"
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load -i lg5-loyalty-ledger-service-image.tar

      - name: Show docker image
        run: docker image list | grep com.

      - name: Restore Maven Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Setup Maven credentials
        uses: ./.github/actions/setup-maven-credentials
        with:
          github-token: ${{ secrets.PKG_GITHUB_TOKEN }}

      # Install sibling modules into the runner's local ~/.m2 so that
      # `make run-atdd-module` (which runs `mvn -pl <atdd>`) can resolve
      # them. The canonical cache key is shared across all jobs and
      # only the first finishing job (`setup`) writes; downstream jobs
      # see cache-hit and don't persist their installs. Cheapest fix
      # without diverging the canonical cache strategy is a quick
      # skip-tests install on this runner. Mirrors how the legacy
      # `it` job worked pre-feature-003.
      - name: Install sibling modules (skip tests)
        run: make install-skip-test

      - name: Run acceptance tests using Makefile
        run: make run-atdd-module

      - name: List files in target directory
        run: ls -R ./lg5-loyalty-ledger-acceptance-test/target/
      - name: List files in parent target directory
        run: ls -R ./

      - name: Upload Cucumber Report
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: ./lg5-loyalty-ledger-acceptance-test/target/atdd-reports/cucumber-reports.html

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ./lg5-loyalty-ledger-acceptance-test/target/allure-results
          if-no-files-found: ignore

  openapi:
    name: OpenAPI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Assemble OpenAPI site (Swagger UI via CDN)
        # Spec lives under docs/api/ in this repo (chosen by feature 002),
        # not under lg5-loyalty-ledger-api/src/main/resources/spec/ — adjust
        # the source path; template assembly is otherwise verbatim.
        run: |
          set -euo pipefail
          mkdir -p ./lg5-loyalty-ledger-support/openapi
          cp ./lg5-loyalty-ledger-support/openapi-template/index.html ./lg5-loyalty-ledger-support/openapi/index.html
          cp ./docs/api/openapi.yaml \
             ./lg5-loyalty-ledger-support/openapi/openapi.yaml

      - name: List files in target directory
        run: ls -al ./lg5-loyalty-ledger-support/openapi

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-doc
          path: ./lg5-loyalty-ledger-support/openapi
  asyncapi:
    name: AsyncAPI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Assemble AsyncAPI site (Studio-like, web-component via CDN)
        # Spec lives under docs/api/ in this repo (chosen by feature 002),
        # not under lg5-loyalty-ledger-message/.../message-model/.../spec/.
        run: |
          set -euo pipefail
          mkdir -p ./lg5-loyalty-ledger-support/asyncapi
          cp ./lg5-loyalty-ledger-support/asyncapi-template/index.html ./lg5-loyalty-ledger-support/asyncapi/index.html
          cp ./docs/api/asyncapi.yaml \
             ./lg5-loyalty-ledger-support/asyncapi/asyncapi.yaml

      - name: Display structure of generated files
        run: ls -al ./lg5-loyalty-ledger-support/asyncapi

      - name: Upload AsyncAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: asyncapi-doc
          path: ./lg5-loyalty-ledger-support/asyncapi

  allure:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Download Allure raw results
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: ./allure-results
        continue-on-error: true

      - name: Set up Allure CLI
        run: |
          set -euo pipefail
          ALLURE_VERSION=2.32.0
          curl -sL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            | tar -xz -C "$HOME"
          echo "$HOME/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure HTML report
        run: |
          set -euo pipefail
          allure --version
          allure generate ./allure-results --clean -o ./allure-report

      - name: Display generated files
        run: ls -al ./allure-report

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ./allure-report
  # NOTE: The canonical `docs` job (MkDocs build + upload) is intentionally
  # omitted in feature 003. This service will publish project docs via
  # VitePress in feature 004 (`004-project-docs`), which redesigns this job
  # to build the VitePress site, publish to GitHub Pages, and deploy to
  # Firebase Hosting (live + per-PR preview channels). The upstream
  # `dependency-graph` and `gource` artifacts produced by `build` and
  # `visualization` are kept; feature 004 will consume them inside the
  # VitePress site under `architecture/` and `history/`.
  # See: docs/specs/003-ci-cd-canonical/adr/ADR-003-defer-mkdocs-to-feature-004.md
  visualization:
    name: Visualization
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gource-Action
        uses: NBprojekt/gource-action@d2fdf85904db416b69445dae5551282528e052ae # v1.2.1
        with:
          gource_title: ${{ github.repository }}
          gource_resolution: '2160p'
          gource_fps: 30
          gource_font_size: 10
          gource_background_color: 555555
      - uses: actions/upload-artifact@v4
        with:
          name: gource
          path: ./gource/gource.mp4

  # ADR-001 (003-ci-cd-canonical) — preserved from feat 002 / TASK-004.
  # Spectral lint of OpenAPI + AsyncAPI specs. Node-only, no Maven, no JDK.
  # Source: pre-canonical .github/workflows/ci.yml lines 21-40 (deleted in this PR).
  api-specs-lint:
    name: API specs lint (Spectral)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js (for Spectral CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral CLI (pinned)
        run: npm install -g @stoplight/spectral-cli@6.15.1

      - name: Lint OpenAPI + AsyncAPI specs
        # Fails the job on any warning or error. Info-level findings
        # (e.g. asyncapi-latest-version) do NOT fail — we keep
        # AsyncAPI 2.6 deliberately for tooling compatibility.
        run: spectral lint docs/api/openapi.yaml docs/api/asyncapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  # ADR-001 (003-ci-cd-canonical) — preserved from feat 001 / TASK-014.
  # Schema-Registry compatibility gate: idempotency + positive + negative case.
  # `needs:` relaxed from `build` to `setup` per ADR-001 (Make+Kafka self-contained, no Maven build needed).
  # Source: pre-canonical .github/workflows/ci.yml lines 181-302 (deleted in this PR).
  schema-compat:
    name: Schema-Registry compatibility gate (TASK-014)
    runs-on: ubuntu-latest
    needs: setup
    services:
      # Lightweight Kafka + Schema Registry stack just for the gate.
      # Versions match lg5-loyalty-ledger-support/docker/.env (KAFKA_VERSION=7.5.0).
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 9092:9092
      schema-registry:
        image: confluentinc/cp-schema-registry:7.5.0
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Wait for Schema Registry to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/subjects >/dev/null 2>&1; then
              echo "Schema Registry is up (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Schema Registry did not become ready in 60s" >&2
          exit 1

      - name: Register schemas (publish-schemas; idempotent)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: make publish-schemas

      - name: Re-run publish-schemas (must be a no-op — idempotency check)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: |
          before=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          make publish-schemas
          after=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then
            echo "FAIL: re-running publish-schemas created new version(s) (before=$before, after=$after)" >&2
            exit 1
          fi
          echo "OK: publish-schemas is idempotent (versions=$after)"

      - name: Compatibility check on current sources (must PASS)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: make check-schema-compat

      - name: Compatibility check rejects breaking change (must FAIL without registering)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: |
          # Snapshot registered version count for the record subject.
          before=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')

          # Mutate a copy of the record schema with a BACKWARD-incompatible
          # change: add a required (non-defaulted) field. Under Avro
          # BACKWARD semantics a new reader of old data has no value to
          # supply for the new field, so this is correctly rejected.
          # (Removing a field is BACKWARD-compatible — the new reader
          # ignores it — so it is NOT a valid negative test here.)
          schema=lg5-loyalty-ledger-message/lg5-loyalty-ledger-message-model/src/main/resources/avro/customer_balance_updated.avsc
          cp "$schema" "$schema.bak"
          python3 -c '
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              s = json.load(f)
          s["fields"].append({"name": "newRequiredField", "type": "string"})
          with open(path, "w") as f:
              json.dump(s, f, indent=2)
          ' "$schema"

          set +e
          make check-schema-compat
          rc=$?
          set -e

          # Restore the original file regardless of outcome.
          mv "$schema.bak" "$schema"

          if [ "$rc" = "0" ]; then
            echo "FAIL: check-schema-compat returned 0 for a known-incompatible change" >&2
            exit 1
          fi
          echo "OK: check-schema-compat correctly rejected the breaking change (rc=$rc)"

          # Confirm the gate did NOT register the bad schema.
          after=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then
            echo "FAIL: check-schema-compat had a side effect (versions before=$before after=$after)" >&2
            exit 1
          fi
          echo "OK: check-schema-compat is read-only (versions=$after)"

  # ─── DOCS jobs (feat 004 — VitePress build) ───
  # See docs/specs/004-project-docs/design.md §7.9–§7.10.
  # Two near-identical jobs: one for GitHub Pages (DOCS_BASE='/lg5-loyalty-ledger/'),
  # one for Firebase Hosting (DOCS_BASE='/'). Both consume artifacts from the
  # upstream `build`, `visualization`, `openapi`, and `asyncapi` jobs and place
  # them under the paths that scripts/check-artifacts.mjs expects.
  #
  # Constraint C (stakeholder-decided): upstream `openapi` / `asyncapi` jobs
  # produce `index.html` (not `swagger-ui.html` / `asyncapi.html`). The download
  # steps below rename via `cp`.
  #
  # IMPORTANT — VitePress static-asset wiring:
  # The HTML viewers MUST be placed under `docs/site/public/` (not under
  # `docs/site/api/` or `docs/site/events/`) so that VitePress serves them
  # verbatim instead of trying to process them as routes. VitePress copies
  # everything under `public/` to the build root preserving structure, so
  # `docs/site/public/api/swagger-ui.html` is served at `/api/swagger-ui.html`
  # (or `/lg5-loyalty-ledger/api/swagger-ui.html` for the Pages base). This
  # mirrors the dependency-graph.png / gource.mp4 pattern. See:
  # https://vitepress.dev/guide/asset-handling#the-public-directory
  docs-build-pages:
    name: Docs Build (Pages)
    runs-on: ubuntu-latest
    needs: [openapi, asyncapi, build, visualization]
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.9
      - name: Install docs dependencies
        working-directory: ${{ github.workspace }}
        run: make docs-install
      # --- Download upstream artifacts (4 of them) ---
      - name: Download dependency-graph
        uses: actions/download-artifact@v4
        with:
          name: dependency-graph
          path: docs/site/public
      - name: Download gource
        uses: actions/download-artifact@v4
        with:
          name: gource
          path: docs/site/public
      - name: Download openapi-doc (renamed → swagger-ui.html)
        uses: actions/download-artifact@v4
        with:
          name: openapi-doc
          path: /tmp/openapi-artifact
      - name: Place swagger-ui.html into docs/site/public/api/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p docs/site/public/api
          cp /tmp/openapi-artifact/index.html docs/site/public/api/swagger-ui.html
          # Also copy the raw spec so the Swagger UI page can fetch it relative.
          if [ -f /tmp/openapi-artifact/openapi.yaml ]; then
            cp /tmp/openapi-artifact/openapi.yaml docs/site/public/api/openapi.yaml
          fi
      - name: Download asyncapi-doc (renamed → asyncapi.html)
        uses: actions/download-artifact@v4
        with:
          name: asyncapi-doc
          path: /tmp/asyncapi-artifact
      - name: Place asyncapi.html into docs/site/public/events/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p docs/site/public/events
          cp /tmp/asyncapi-artifact/index.html docs/site/public/events/asyncapi.html
          if [ -f /tmp/asyncapi-artifact/asyncapi.yaml ]; then
            cp /tmp/asyncapi-artifact/asyncapi.yaml docs/site/public/events/asyncapi.yaml
          fi
      # --- Build with Pages base ---
      - name: Build VitePress site (Pages base)
        working-directory: ${{ github.workspace }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIME
          make docs-build-pages
      # --- Linkinator broken-link check (warn-not-fail; always exits 0) ---
      - name: Check links (warn-not-fail)
        working-directory: ${{ github.workspace }}
        run: cd docs/site && node scripts/linkinator-to-annotations.mjs
      # --- Upload artifact ---
      - name: Upload docs-dist-pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist-pages
          path: docs/site/.vitepress/dist
          if-no-files-found: error

  docs-build-firebase:
    name: Docs Build (Firebase)
    runs-on: ubuntu-latest
    needs: [openapi, asyncapi, build, visualization]
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.9
      - name: Install docs dependencies
        working-directory: ${{ github.workspace }}
        run: make docs-install
      # --- Download upstream artifacts (4 of them) ---
      - name: Download dependency-graph
        uses: actions/download-artifact@v4
        with:
          name: dependency-graph
          path: docs/site/public
      - name: Download gource
        uses: actions/download-artifact@v4
        with:
          name: gource
          path: docs/site/public
      - name: Download openapi-doc (renamed → swagger-ui.html)
        uses: actions/download-artifact@v4
        with:
          name: openapi-doc
          path: /tmp/openapi-artifact
      - name: Place swagger-ui.html into docs/site/public/api/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p docs/site/public/api
          cp /tmp/openapi-artifact/index.html docs/site/public/api/swagger-ui.html
          # Also copy the raw spec so the Swagger UI page can fetch it relative.
          if [ -f /tmp/openapi-artifact/openapi.yaml ]; then
            cp /tmp/openapi-artifact/openapi.yaml docs/site/public/api/openapi.yaml
          fi
      - name: Download asyncapi-doc (renamed → asyncapi.html)
        uses: actions/download-artifact@v4
        with:
          name: asyncapi-doc
          path: /tmp/asyncapi-artifact
      - name: Place asyncapi.html into docs/site/public/events/
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p docs/site/public/events
          cp /tmp/asyncapi-artifact/index.html docs/site/public/events/asyncapi.html
          if [ -f /tmp/asyncapi-artifact/asyncapi.yaml ]; then
            cp /tmp/asyncapi-artifact/asyncapi.yaml docs/site/public/events/asyncapi.yaml
          fi
      # --- Build with Firebase base (DOCS_BASE='/') ---
      - name: Build VitePress site (Firebase base)
        working-directory: ${{ github.workspace }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_TIME
          make docs-build-firebase
      # --- Linkinator broken-link check (warn-not-fail; always exits 0) ---
      - name: Check links (warn-not-fail)
        working-directory: ${{ github.workspace }}
        run: cd docs/site && node scripts/linkinator-to-annotations.mjs
      # --- Upload artifact ---
      - name: Upload docs-dist-firebase artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist-firebase
          path: docs/site/.vitepress/dist
          if-no-files-found: error

  # ─── DOCS deploy jobs (feat 004 — push:main only) ───
  # See docs/specs/004-project-docs/design.md §7.9 (lines 348-393).
  # Pages deploy uses default GITHUB_TOKEN; Firebase deploys use the
  # FIREBASE_SERVICE_ACCOUNT_LGLABS_LOYALTY secret (service account JSON).
  pages-deploy:
    name: Pages Deploy (docs)
    runs-on: ubuntu-latest
    needs: docs-build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs-dist-pages artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist-pages
          path: ./pages-dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # GitHub Pages requires its own artifact format (a tarball uploaded by
      # actions/upload-pages-artifact, not the regular upload-artifact). We
      # re-upload the regular artifact here in the Pages-format expected by
      # actions/deploy-pages.
      - name: Upload Pages artifact (re-upload as Pages-format tarball)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  firebase-deploy-docs:
    name: Firebase Deploy (docs)
    runs-on: ubuntu-latest
    needs: docs-build-firebase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.9
      - name: Install docs dependencies
        working-directory: ${{ github.workspace }}
        run: make docs-install
      - name: Download docs-dist-firebase artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist-firebase
          path: docs/site/.vitepress/dist
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LGLABS_LOYALTY }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy to Firebase Hosting (docs target)
        run: pnpm exec firebase deploy --only hosting:docs --project lglabs-loyalty --non-interactive

  firebase-deploy-allure:
    name: Firebase Deploy (allure)
    runs-on: ubuntu-latest
    needs: allure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.9
      - name: Install docs dependencies
        working-directory: ${{ github.workspace }}
        run: make docs-install
      - name: Download allure-report artifact (from upstream allure job)
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: docs/site/allure-dist
      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_LGLABS_LOYALTY }}' > /tmp/firebase-sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Deploy to Firebase Hosting (allure target)
        run: pnpm exec firebase deploy --only hosting:allure --project lglabs-loyalty --non-interactive

  # ─── DOCS preview job (feat 004 — pull_request + label gate) ───
  # See docs/specs/004-project-docs/design.md §7.9 lines 395-401 + §7.10 row 6.
  # Stakeholder Q3: auto-comment of preview URL is provided by
  # FirebaseExtended/action-hosting-deploy@v0 itself (idempotent: a single
  # PR comment is created and edited in place across re-deploys).
  # Risk R3 (fork PRs): the action fails fast if the Firebase secret is
  # unavailable; no manual fork-skip clause needed.
  firebase-preview:
    name: Firebase Preview (PR channel)
    runs-on: ubuntu-latest
    needs: docs-build-firebase
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'docs/preview')
    permissions:
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - name: Download docs-dist-firebase artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist-firebase
          path: docs/site/.vitepress/dist
      - name: Deploy to Firebase preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LGLABS_LOYALTY }}
          projectId: lglabs-loyalty
          target: docs
          expires: 7d
          entryPoint: docs/site
