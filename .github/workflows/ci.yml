name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  build:
    name: Build (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Graphviz (required by depgraph-maven-plugin in framework parent)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings.xml for GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          PKG_GITHUB_TOKEN: ${{ secrets.PKG_GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>github</id>
                      <username>${GITHUB_USERNAME}</username>
                      <password>${PKG_GITHUB_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github</id>
                      <repositories>
                          <repository>
                              <id>github</id>
                              <url>https://maven.pkg.github.com/lg-labs-pentagon/*</url>
                              <snapshots>
                                  <enabled>true</enabled>
                              </snapshots>
                          </repository>
                      </repositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github</activeProfile>
              </activeProfiles>
          </settings>
          EOF

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build (compile + install, skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: Run unit tests
        run: mvn -B -ntp test

  it:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Graphviz (required by depgraph-maven-plugin in framework parent)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Configure Maven settings.xml for GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          PKG_GITHUB_TOKEN: ${{ secrets.PKG_GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>github</id>
                      <username>${GITHUB_USERNAME}</username>
                      <password>${PKG_GITHUB_TOKEN}</password>
                  </server>
              </servers>
              <profiles>
                  <profile>
                      <id>github</id>
                      <repositories>
                          <repository>
                              <id>github</id>
                              <url>https://maven.pkg.github.com/lg-labs-pentagon/*</url>
                              <snapshots>
                                  <enabled>true</enabled>
                              </snapshots>
                          </repository>
                      </repositories>
                  </profile>
              </profiles>
              <activeProfiles>
                  <activeProfile>github</activeProfile>
              </activeProfiles>
          </settings>
          EOF

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run integration tests (`*IT.java`)
        # Testcontainers works out-of-the-box on ubuntu-latest (Docker preinstalled).
        run: mvn -B -ntp verify -DskipUnitTests=true -Dsurefire.skip=true

  schema-compat:
    name: Schema-Registry compatibility gate (TASK-014)
    runs-on: ubuntu-latest
    needs: build
    services:
      # Lightweight Kafka + Schema Registry stack just for the gate.
      # Versions match lg5-loyalty-ledger-support/docker/.env (KAFKA_VERSION=7.5.0).
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        ports:
          - 9092:9092
      schema-registry:
        image: confluentinc/cp-schema-registry:7.5.0
        env:
          SCHEMA_REGISTRY_HOST_NAME: schema-registry
          SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
          SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
        ports:
          - 8081:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Wait for Schema Registry to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/subjects >/dev/null 2>&1; then
              echo "Schema Registry is up (after ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Schema Registry did not become ready in 60s" >&2
          exit 1

      - name: Register schemas (publish-schemas; idempotent)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: make publish-schemas

      - name: Re-run publish-schemas (must be a no-op — idempotency check)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: |
          before=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          make publish-schemas
          after=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then
            echo "FAIL: re-running publish-schemas created new version(s) (before=$before, after=$after)" >&2
            exit 1
          fi
          echo "OK: publish-schemas is idempotent (versions=$after)"

      - name: Compatibility check on current sources (must PASS)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: make check-schema-compat

      - name: Compatibility check rejects breaking change (must FAIL without registering)
        env:
          SCHEMA_REGISTRY_URL: http://localhost:8081
        run: |
          # Snapshot registered version count for the record subject.
          before=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')

          # Mutate a copy of the record schema by removing the `delta` field
          # (a BACKWARD-incompatible change for any consumer that expects it).
          schema=lg5-loyalty-ledger-message/lg5-loyalty-ledger-message-model/src/main/resources/avro/customer_balance_updated.avsc
          cp "$schema" "$schema.bak"
          python3 -c '
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              s = json.load(f)
          s["fields"] = [fld for fld in s["fields"] if fld["name"] != "delta"]
          with open(path, "w") as f:
              json.dump(s, f, indent=2)
          ' "$schema"

          set +e
          make check-schema-compat
          rc=$?
          set -e

          # Restore the original file regardless of outcome.
          mv "$schema.bak" "$schema"

          if [ "$rc" = "0" ]; then
            echo "FAIL: check-schema-compat returned 0 for a known-incompatible change" >&2
            exit 1
          fi
          echo "OK: check-schema-compat correctly rejected the breaking change (rc=$rc)"

          # Confirm the gate did NOT register the bad schema.
          after=$(curl -fsS http://localhost:8081/subjects/customer-balance-updated-value/versions | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$before" != "$after" ]; then
            echo "FAIL: check-schema-compat had a side effect (versions before=$before after=$after)" >&2
            exit 1
          fi
          echo "OK: check-schema-compat is read-only (versions=$after)"
