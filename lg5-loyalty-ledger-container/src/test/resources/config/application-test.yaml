spring:
  application:
    name: lg5-loyalty-ledger
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

# Disable scheduler in test profile (RULE-012)
scheduling:
  enabled: false

# Testcontainers gates: Postgres is the default IT substrate; Kafka/SR stay
# opt-in via @TestPropertySource on the Kafka ITs (RULE-013).
testcontainers:
  postgres:
    enabled: true
  kafka:
    enabled: false
  schema-registry:
    enabled: false

application:
  image:
    name: lg5-loyalty-ledger
  traces:
    console:
      enabled: true
    file:
      enabled: false
